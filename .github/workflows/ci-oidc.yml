name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read          # 최소 권한
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      # checkout v4.2.2 — 태그 아닌 커밋 SHA로 고정
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0   # 전체 이력 스캔
      - name: 스캐너 설치
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
            -o /tmp/gitleaks.tgz
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          python3 -m pip install --quiet semgrep
      - name: 시크릿 스캔 (차단)
        run: gitleaks git . -v --exit-code 1
      - name: SAST (차단)
        run: semgrep --config p/ci --config p/python --error demo-app/
      - name: SCA · IaC (차단 — CRITICAL만)
        run: trivy fs --scanners vuln,misconfig . --exit-code 1 --severity CRITICAL
  deploy:
    needs: guard                     # 게이트를 통과해야 배포
    if: github.ref == 'refs/heads/main'
    environment: production          # 신뢰 정책의 sub 와 짝
    runs-on: ubuntu-latest
    permissions: { id-token: write } # OIDC 토큰 발급 권한
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2   # 필수 입력
      - run: aws sts get-caller-identity   # 누구로 전환됐는지 확인
